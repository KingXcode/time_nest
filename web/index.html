<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="此刻：极简桌面时钟与每日看板。天气、项目更新、科技资讯与 A 股历史走势。">
  <meta name="theme-color" content="#08090B">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="此刻">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>此刻 · 极简桌面时钟</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08090B; color: #E8E9EB; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    #app {
      position: fixed;
      top: calc(var(--app-viewport-top, 0px) + env(safe-area-inset-top, 0px));
      left: calc(var(--app-viewport-left, 0px) + env(safe-area-inset-left, 0px));
      width: calc(var(--app-viewport-width, 100vw) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      height: calc(var(--app-viewport-height, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      overflow: hidden;
      overflow: clip; /* Prevent native iframe focus from scrolling the fixed Flutter host. */
    }
    /* The engine also sets overflow:hidden on its embedded root. */
    #app > flutter-view { overflow: clip !important; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    #loading h1 { font-size: 24px; letter-spacing: 8px; font-weight: 400; margin: 0 0 16px; }
    #loading-clock { font-size: clamp(36px, 12vw, 100px); font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; margin: 12px 0; }
    #loading p { font-size: 13px; color: #989DA5; line-height: 1.8; }
    #retry { color: #E8E9EB; background: #20232A; border: 0; border-radius: 8px; padding: 12px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading" role="status">
    <h1>此刻</h1>
    <div id="loading-clock" aria-hidden="true">--:--:--</div>
    <p id="loading-message">让时间安静一点。<br>首次打开正在准备本地资源…</p>
    <button id="retry" hidden onclick="location.reload()">重新加载</button>
  </div>
  <noscript>此刻需要 JavaScript 才能显示实时的设备时间，请启用后重新打开。</noscript>
  <script>
    // Keep a retry path even if the optional lightweight loading script fails.
    window.shikeLoadError = function () {
      document.getElementById('loading-message').textContent = '加载未完成，请检查网络后重试。';
      document.getElementById('retry').hidden = false;
    };
  </script>
  <script src="loading.js" onerror="shikeLoadError()"></script>
  <script src="viewport.js"></script>
  <script src="platform.js"></script>
  <script src="dashboard.js"></script>
  <script src="flutter_bootstrap.js" async onerror="shikeLoadError()"></script>
</body>
</html>

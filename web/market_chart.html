<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ks3vA39ygNLJijaDCRi4vbKoBtmikXcd9cy76vXOKh8='; style-src 'unsafe-inline'; frame-src https://www.tradingview-widget.com; base-uri 'none'; form-action 'none'">
  <title>A股历史走势 · TradingView</title>
  <style>
    html,body{height:100%;margin:0;background:#131722;color:#a0aaa9;font:12px/1.5 system-ui,sans-serif}
    body{display:flex;flex-direction:column}
    #help{flex:none;margin:0;padding:8px 10px;line-height:1.6;border-bottom:1px solid #29333f}
    #fallback{display:inline-block;margin-left:4px}
    #chart{flex:1;min-height:0;width:100%;display:flex;flex-direction:column}
    .tradingview-widget-container__widget{flex:1;min-height:0;width:100%}
    iframe{display:block;width:100%;height:100%;border:0}
    .tradingview-widget-copyright{flex:none;min-height:32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
    a{color:#67d8c2;text-decoration:none}a:hover{text-decoration:underline}
    #status{flex:none;margin:8px 10px;font-size:11px}#status:empty{display:none}
  </style>
</head>
<body>
  <p id="help">图表空白或无法加载？<a id="fallback" href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">打开 TradingView 官方网站</a></p>
  <div id="chart" class="tradingview-widget-container">
    <div id="widget" class="tradingview-widget-container__widget"></div>
    <div class="tradingview-widget-copyright"><a id="source" href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank"><span class="blue-text">TradingView 图表</span></a><span class="trademark"> by TradingView</span></div>
  </div>
  <p id="status" role="status">内嵌图表尚未启动。若持续空白，请打开上方官方来源。</p>
  <noscript><p>浏览器未运行 JavaScript，无法显示内嵌图表。官方来源链接仍可使用。</p></noscript>
  <script>/* Fixed configuration for TradingView's official iframe widget.
 * The provider URL is emitted by its official embed configurator.
 * No provider JavaScript executes in this document or application origin.
 * No API calls, quote extraction or application data access.
 */
(() => {
  'use strict';
  const status = document.getElementById('status');
  let timer = null;
  function stopTimer() {
    if (timer !== null) clearTimeout(timer);
    timer = null;
  }
  // Keep an actionable static fallback even if CSP or JavaScript is blocked.
  // Start the bounded hint before parsing options or creating provider elements.
  try {
    status.textContent = '正在启动内嵌图表…';
    window.addEventListener('pagehide', stopTimer, { once: true });
    timer = setTimeout(() => {
      timer = null;
      status.textContent = '未显示图表？内嵌内容可能受浏览器或网络限制，请打开上方官方来源。';
    }, 18000);
    const indices = Object.freeze({
      shanghai: ['SSE:000001', '上证指数'],
      shenzhen: ['SZSE:399001', '深证成指'],
      csi300: ['SSE:000300', '沪深300'],
      chinext: ['SZSE:399006', '创业板指'],
      star50: ['SSE:000688', '科创50'],
      allshare: ['SSE:000985', '中证全指'],
    });
    const query = new URLSearchParams(location.search);
    const id = query.get('index');
    const [symbol, name] = Object.prototype.hasOwnProperty.call(indices, id) ? indices[id] : indices.shanghai;
    const interval = ['D', 'W', 'M'].includes(query.get('interval')) ? query.get('interval') : 'D';
    const technical = query.get('kind') === 'technical';
    const source = document.getElementById('source');
    source.href = `https://www.tradingview.com/symbols/${symbol.replace(':', '-')}/`;
    source.firstElementChild.textContent = `${name}${technical ? '技术面' : '图表'}`;
    const fallback = document.getElementById('fallback');
    fallback.href = source.href;
    fallback.textContent = `打开${name}官方来源`;
    if (technical && symbol === 'SSE:000688') {
      stopTimer();
      status.textContent = '科创50 技术评级暂缺，提供方目前没有该指数的评级数据。';
      return;
    }
    const frame = document.createElement('iframe');
    frame.title = `${name} · TradingView ${technical ? '日线技术面' : '历史走势图'}`;
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    const config = technical ? {
      interval: '1D', width: '100%', height: '100%', symbol,
      isTransparent: false, showIntervalTabs: false,
      displayMode: 'single', colorTheme: 'dark', locale: 'zh_CN',
    } : {
      autosize: true,
      width: '100%',
      height: '100%',
      symbol,
      interval,
      timezone: 'Asia/Shanghai',
      theme: 'dark',
      style: '1',
      locale: 'zh_CN',
      allow_symbol_change: false,
      hide_top_toolbar: true,
      hide_side_toolbar: true,
      save_image: false,
      withdateranges: false,
      support_host: 'https://www.tradingview.com',
    };
    const endpoint = technical ? 'technical-analysis' : 'advanced-chart';
    frame.src = `https://www.tradingview-widget.com/embed-widget/${endpoint}/?locale=zh_CN#` + encodeURIComponent(JSON.stringify(config));
    // A frame load is not proof of valid market data. Do not inspect its content
    // or claim success. Provider errors and attribution remain visible.
    frame.onerror = () => {
      stopTimer();
      status.textContent = '内嵌图表连接失败，请打开上方官方来源。';
    };
    document.getElementById('widget').appendChild(frame);
    status.textContent = '已请求 TradingView 内容；数据日期与状态以组件标注为准。';
  } catch (_) {
    stopTimer();
    if (status) status.textContent = '内嵌图表未能启动，请打开上方官方来源。';
  }
})();
</script>
</body>
</html>

name: time_nest
description: "此刻：极简桌面时钟，让时间安静一点。"
publish_to: 'none'
version: 2.7.0+18

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - web/dashboard.js
    - web/network_tools.js
    - assets/macos_runtime.js
    - assets/fonts/OFL-NotoSansSC.txt
    - assets/fonts/OFL-RobotoMono.txt
  fonts:
    - family: ClockDigits
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
    - family: ShikeSans
      fonts:
        - asset: assets/fonts/ShikeSans-Regular.ttf
